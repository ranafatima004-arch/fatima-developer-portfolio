<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fatima Waqar monogram">
  <defs>
    <linearGradient id="favicon-accent" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="favicon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="18" fill="#0b1020" stroke="url(#favicon-accent)" stroke-width="1.7"/>
  <circle cx="46" cy="18" r="4" fill="url(#favicon-accent)" opacity="0.96"/>
  <text x="32" y="39" text-anchor="middle" fill="url(#favicon-accent)" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="23" font-weight="800" letter-spacing="-2" filter="url(#favicon-glow)">FW</text>
</svg>
